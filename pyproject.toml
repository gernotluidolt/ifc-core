[project]
name = "ifc-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gernot Luidolt", email = "gernot.luidolt@swietelsky.at" }
]
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.4.post1",
    "ifctester>=0.8.4",
