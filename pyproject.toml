[project]
name = "ifc-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gernot Luidolt", email = "gernot@luido.lt" }
]
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8.4.post1",
    "ifctester>=0.8.4",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bpy".msg = "Use of 'bpy' matches is forbidden in the engine core. Portability first!"
"Swietoolsky_Blender".msg = "Core engine should not depend on the Blender add-on logic."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
